- insert:
    - id: evo-persona
      name: dsh-evo-subagent/persona
    - id: evo-user-habits
      name: dsh-evo-subagent/habits
    - id: evo-subagent
      name: dsh-evo-subagent
      config:
        bindingsDir: !!js process.env.EVO_SUBAGENT_BINDINGS_DIR || process.env.DSH_AGENT_BINDINGS_DIR || 'agents'
        evolutionDir: !!js process.env.EVO_SUBAGENT_EVOLUTION_DIR || ''
        projectsBaseDir: !!js process.env.EVO_SUBAGENT_PROJECTS_DIR || ''
        provider: spawn
        toolName: evo_subagent
        maxDepth: 3
